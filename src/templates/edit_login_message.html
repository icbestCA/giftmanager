{% extends 'base.html' %}
{% block title %}{{ _('Edit Login Message') }}{% endblock %}
{% block page_title %}{{ _('Edit Login Message') }}{% endblock %}
{% block sidebar %}{% include '_admin_sidebar.html' %}{% endblock %}

{% block content %}
<section class="card mx-auto w-full max-w-3xl p-4 sm:p-6">
    <h2 class="section-title text-center">{{ _('Edit Login Message') }}</h2>
    <form method="post" class="space-y-4">
        <textarea name="login_message" rows="5" class="input resize-none">{{ current_message }}</textarea>
        <button type="submit" class="btn-primary w-full">{{ _('Update Message') }}</button>
    </form>
</section>
{% endblock %}
