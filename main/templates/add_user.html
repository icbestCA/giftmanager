{% extends "admin_base.html" %}

{% block title %}{{ _('New User') }}{% endblock %}
{% block page_title %}{{ _('Add User') }}{% endblock %}

{% block content %}
<div class="container mx-auto">
    <div class="section shadow-lg rounded-lg p-6 max-w-3xl mx-auto">
        <div class="flex justify-between items-center mb-4">
            <h1 class="text-2xl font-semibold" style="color: var(--text-color);">{{ _('New User') }}</h1>
        </div>

        <form action="{{ url_for('add_user') }}" method="post" enctype="multipart/form-data">
            <div class="mb-4">
                <label for="username" class="block sec-text font-bold">{{ _('Username for login:') }}</label>
                <input type="text" name="username" id="username"
                       class="border rounded py-2 px-3 w-full inputer" required>
            </div>

            <div class="mb-4">
                <label for="password" class="block sec-text font-bold">{{ _('Password:') }}</label>
                <input type="password" name="password" id="password"
                       class="border rounded py-2 px-3 w-full inputer" required>
            </div>

            <div class="mb-4">
                <label for="full_name" class="block sec-text font-bold">{{ _('Complete name:') }}</label>
                <input type="text" name="full_name" id="full_name"
                       class="border rounded py-2 px-3 w-full inputer" required>
            </div>

            <div class="mb-4">
                <label for="birthday" class="block sec-text font-bold">{{ _('Birthday:') }}</label>
                <input type="date" name="birthday" id="birthday"
                       class="border rounded py-2 px-3 w-full inputer" required>
            </div>

            <div class="mb-4">
                <label for="email" class="block sec-text font-bold">{{ _('Email:') }}</label>
                <input type="email" name="email" id="email"
                       class="border rounded py-2 px-3 w-full inputer">
            </div>

            <div class="mb-4">
                <fieldset class="relative border border-gray-300 rounded-lg p-4 w-min" id="avatar-picker">
                    <legend class="main absolute -top-3 left-4 px-2 text-sm font-semibold sec-text">
                        {{ _('Select an avatar') }}
                    </legend>
                    <div class="flex items-center gap-4">
                        <label class="relative w-32 h-32 rounded-full overflow-hidden flex-shrink-0">
                            <input type="text" name="avatar" value="{{ avatar }}" class="sr-only" id="avatar_input"/>
                            <img src="{{ url_for('show_avatar', filename=avatar) }}"
                                 alt="{{ _('Avatar') }}"
                                 class="w-full h-full object-cover"
                                 id="avatar_image"/>
                        </label>

                        <div class="flex flex-col gap-2">
                            <div class="px-3 py-2 rounded-md border border-gray-300 bg-gray-100 text-sm text-center cursor-pointer inputer"
                                 id="generate_button">
                                {{ _('Random avatar') }}
                            </div>

                            <label class="px-3 py-2 rounded-md border border-gray-300 bg-gray-100 text-sm text-center cursor-pointer inputer">
                                {{ _('Upload image') }}
                                <input type="file" name="new_avatar" accept="image/*"
                                       class="sr-only" id="new_avatar_input"/>
                            </label>
                        </div>
                    </div>
                </fieldset>
            </div>

            <button type="submit" class="bg-green-500 text-white px-3 py-2 rounded hover:bg-green-600 transition">
                {{ _('Add') }}
            </button>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const add_avatar_input = document.getElementById("new_avatar_input");
    add_avatar_input.addEventListener('change', () => {
        const file = add_avatar_input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
            document.getElementById("avatar_image").src = event.target.result;
            document.getElementById("avatar_input").value = file.name;
        };
        reader.readAsDataURL(file);
    });

    async function generate_new_avatar() {
        const response = await fetch("{{ url_for('generate_avatar') }}");
        const data = await response.json();
        document.getElementById("avatar_image").src = `/avatars/${data['filename']}`;
        document.getElementById("avatar_input").value = data['filename'];
    }

    const generate_avatar_button = document.getElementById("generate_button");
    generate_avatar_button.addEventListener('click', generate_new_avatar);
</script>
{% endblock %}
