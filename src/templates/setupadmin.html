{% extends 'base_standalone.html' %}
{% block title %}{{ _('Admin Setup') }}{% endblock %}

{% block content %}
<div class="mb-6 text-center">
    <h1 class="text-2xl font-semibold text-[rgb(var(--text))]">{{ _('Admin Setup') }}</h1>
</div>
<form action="{{ url_for('setup') }}" method="post" class="space-y-4">
    <div>
        <label for="admin_username" class="label font-semibold">{{ _('Username for login:') }}</label>
        <input type="text" name="admin_username" id="admin_username" class="input" required>
    </div>
    <div>
        <label for="admin_password" class="label font-semibold">{{ _('Password:') }}</label>
        <input type="password" name="admin_password" id="admin_password" class="input" required>
    </div>
    <div>
        <label for="admin_email" class="label font-semibold">{{ _('Email:') }}</label>
        <input type="email" name="admin_email" id="admin_email" class="input">
    </div>
    <div>
        <label for="full_name" class="label font-semibold">{{ _('Full Name:') }}</label>
        <input type="text" name="full_name" id="full_name" class="input" required>
    </div>
    <div>
        <label for="birthday" class="label font-semibold">{{ _('Birthday:') }}</label>
        <input type="date" name="birthday" id="birthday" class="input" required>
    </div>
    <button type="submit" class="btn-primary w-full py-2.5">{{ _('Create Admin Account') }}</button>
</form>
{% endblock %}
