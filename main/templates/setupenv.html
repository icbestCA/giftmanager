<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ _('Environment Setup') }}</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.16/dist/tailwind.min.css" rel="stylesheet">
    <link rel="icon" href="/favicon.ico" type="image/png">
    <meta name="theme-color" content="#000000"/>
    <link rel="manifest" href="/manifest.json">
</head>
<body class="text-gray-900 font-sans">
    <div class="container mx-auto p-8">
        <h1 class="text-2xl font-semibold mb-4">{{ _('Environment Variable Setup') }}</h1>

        <form action="{{ url_for('setupenv') }}" method="POST">

            <div class="mb-4">
                <label for="SYSTEM_EMAIL" class="block text-gray-700 font-bold">{{ _('System Email:') }}</label>
                <input type="email" name="SYSTEM_EMAIL" id="SYSTEM_EMAIL" class="border rounded py-2 px-3 w-full" placeholder="{{ _('System Email') }}">
            </div>

            <div class="mb-4">
                <label for="SMTP_HOST" class="block text-gray-700 font-bold">{{ _('SMTP Host:') }}</label>
                <input type="text" name="SMTP_HOST" id="SMTP_HOST" class="border rounded py-2 px-3 w-full" placeholder="smtp.example.com">
            </div>

            <div class="mb-4">
                <label for="SMTP_PORT" class="block text-gray-700 font-bold">{{ _('SMTP Port:') }}</label>
                <input type="number" name="SMTP_PORT" id="SMTP_PORT" class="border rounded py-2 px-3 w-full" placeholder="587" value="587">
            </div>

            <div class="mb-4 flex gap-6 flex-wrap">
                <label class="inline-flex items-center gap-2 text-gray-700 font-bold">
                    <input type="checkbox" name="SMTP_USE_TLS" value="true" checked>
                    {{ _('Use TLS') }}
                </label>
                <label class="inline-flex items-center gap-2 text-gray-700 font-bold">
                    <input type="checkbox" name="SMTP_USE_SSL" value="true">
                    {{ _('Use SSL') }}
                </label>
            </div>

            <div class="mb-4">
                <label for="SMTP_USERNAME" class="block text-gray-700 font-bold">{{ _('SMTP Username:') }}</label>
                <input type="text" name="SMTP_USERNAME" id="SMTP_USERNAME" class="border rounded py-2 px-3 w-full" placeholder="{{ _('SMTP Username') }}">
            </div>

            <div class="mb-4">
                <label for="DELETE_DAYS" class="block text-gray-700 font-bold">{{ _('Delete Days:') }}</label>
                <input type="number" name="DELETE_DAYS" id="DELETE_DAYS" class="border rounded py-2 px-3 w-full" placeholder="{{ _('Default: 30') }}" value="{{ DELETE_DAYS }}">
            </div>            

            <div class="mb-4">
                <label for="OIDC_SERVER_METADATA_URL" class="block text-gray-700 font-bold">{{ _('OIDC Server Metadata URL:') }}</label>
                <input type="url" name="OIDC_SERVER_METADATA_URL" id="OIDC_SERVER_METADATA_URL" class="border rounded py-2 px-3 w-full" placeholder="{{ _('OIDC Server Metadata URL') }}">
            </div>

            <div class="mb-4">
                <label for="OIDC_LOGOUT_URL" class="block text-gray-700 font-bold">{{ _('OIDC Logout URL:') }}</label>
                <input type="url" name="OIDC_LOGOUT_URL" id="OIDC_LOGOUT_URL" class="border rounded py-2 px-3 w-full" placeholder="{{ _('OIDC Logout URL') }}">
            </div>

            <div class="mb-4">
                <label for="PRIMARY_OIDC_FIELD" class="block text-gray-700 font-bold">{{ _('Primary OIDC Field:') }}</label>
                <input type="text" name="PRIMARY_OIDC_FIELD" id="PRIMARY_OIDC_FIELD" class="border rounded py-2 px-3 w-full" value="email" placeholder="{{ _('Default: email') }}">
            </div>

            <div class="mb-4">
                <label for="SECONDARY_OIDC_FIELD" class="block text-gray-700 font-bold">{{ _('Secondary OIDC Field:') }}</label>
                <input type="text" name="SECONDARY_OIDC_FIELD" id="SECONDARY_OIDC_FIELD" class="border rounded py-2 px-3 w-full" value="preferred_username" placeholder="{{ _('Default: preferred_username') }}">
            </div>

            <div class="mb-4">
                <label for="PRIMARY_DB_FIELD" class="block text-gray-700 font-bold">{{ _('Primary DB Field:') }}</label>
                <input type="text" name="PRIMARY_DB_FIELD" id="PRIMARY_DB_FIELD" class="border rounded py-2 px-3 w-full" value="email" placeholder="{{ _('Default: email') }}">
            </div>

            <div class="mb-4">
                <label for="SECONDARY_DB_FIELD" class="block text-gray-700 font-bold">{{ _('Secondary DB Field:') }}</label>
                <input type="text" name="SECONDARY_DB_FIELD" id="SECONDARY_DB_FIELD" class="border rounded py-2 px-3 w-full" value="username" placeholder="{{ _('Default: username') }}">
            </div>

            <div class="mb-4">
                <label for="ENABLE_AUTO_REGISTRATION" class="block text-gray-700 font-bold">{{ _('Enable Auto Registration:') }}</label>
                <select name="ENABLE_AUTO_REGISTRATION" id="ENABLE_AUTO_REGISTRATION" class="border rounded py-2 px-3 w-full">
                    <option value="true">{{ _('True') }}</option>
                    <option value="false" selected>{{ _('False') }}</option>
                </select>
            </div>
            

            <div class="mb-4">
                <button type="submit" class="bg-blue-500 text-white px-3 py-2 rounded mr-2">{{ _('Save Configuration') }}</button>
                <a href="{{ url_for('index') }}" class="bg-gray-500 text-white px-3 py-2 rounded">{{ _('Skip for Now') }}</a>
                <p class="text-sm text-gray-600 mt-2">{{ _('You can configure these settings later in the parameters section.') }}</p>
            </div>
        </form>
    </div>
    <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(registration => {
            console.log('ServiceWorker registration successful');
          })
          .catch(err => {
            console.log('ServiceWorker registration failed: ', err);
          });
      });
    }
    </script>
</body>
</html>
