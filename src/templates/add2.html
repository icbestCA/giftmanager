{% extends 'base_simple.html' %}
{% block title %}{{ _('New Ideas') }}{% endblock %}
{% block page_title %}{{ _('Add Ideas') }}{% endblock %}

{% block content %}
<section class="card p-4 sm:p-6">
    <form action="{{ url_for('add2', selected_user_id=selected_user_id) }}" method="post" enctype="multipart/form-data" class="space-y-4">
        <div>
            <label for="user" class="label font-semibold">{{ _('Add to:') }}</label>
            <select name="user" id="user" class="input" required>
                <option disabled selected value> {{ _('-- Choose here --') }} </option>
                {% for user in user_list %}
                <option value="{{ user['username'] }}">{{ user['full_name'] }}</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label for="name" class="label font-semibold">{{ _('Title:') }}</label>
            <input type="text" name="name" id="name" class="input" required>
        </div>
        <div>
            <label for="description" class="label font-semibold">{{ _('Description (Optional):') }}</label>
            <textarea name="description" id="description" class="input"></textarea>
        </div>
        <div>
            <label for="link" class="label font-semibold">{{ _('Link (Optional):') }}</label>
            <input type="url" name="link" id="link" class="input">
        </div>
        {% if imgenabled %}
        <div id="imageContainer" class="w-1/3"></div>
        <div id="manualImageUrlContainer" class="hidden">
            <label for="manualImageUrl" class="label font-semibold">{{ _('Enter Image URL (Optional):') }}</label>
            <input type="url" name="manualImageUrl" id="manualImageUrl" class="input">
        </div>
        {% endif %}
        <input type="hidden" id="imagePath" name="imagePath">
        <div>
            <label for="value" class="label font-semibold">{{ _('Estimated Value (Optional):') }}</label>
            <input type="number" id="value" name="value" step="any" placeholder="{{ _('Estimated Value') }}" class="input">
        </div>
        <div>
            <label class="label font-semibold">{{ _('Custom Fields (Optional):') }}</label>
            <div id="customFieldsContainer" class="mt-2 space-y-3"></div>
            <button type="button" onclick="addCustomField()" class="btn-secondary mt-2 text-sm">
                {{ _('+ Add Custom Field') }}
            </button>
        </div>
        <button type="submit" class="btn-primary">{{ _('Submit') }}</button>
    </form>
</section>
{% endblock %}

{% block scripts %}
<script>
    async function fetchOGImage(url) {
        try {
            const response = await fetch(`/fetch_og_image?url=${encodeURIComponent(url)}`);
            const data = await response.json();
            if (data.og_image_url) {
                return data.og_image_url;
            } else {
                console.error('No OG image found:', data.error);
                return null;
            }
        } catch (error) {
            console.error('Error fetching OG image:', error);
            return null;
        }
    }

    function debounce(func, wait) {
        let timeout;
        return function (...args) {
            clearTimeout(timeout);
            timeout = setTimeout(() => func.apply(this, args), wait);
        };
    }

    document.addEventListener('DOMContentLoaded', function () {
        const linkInput = document.getElementById('link');
        const imageContainer = document.getElementById('imageContainer');
        const manualImageUrlContainer = document.getElementById('manualImageUrlContainer');
        const manualImageUrlInput = document.getElementById('manualImageUrl');
        if (!linkInput) return;

        const handleInput = debounce(async () => {
            const url = linkInput.value.trim();
            if (url) {
                try {
                    const ogImage = await fetchOGImage(url);
                    if (ogImage) {
                        imageContainer.innerHTML = `<img src="${ogImage}" alt="OG Image" class="mt-4 w-full rounded shadow-lg">`;
                        document.getElementById('imagePath').value = ogImage;
                        manualImageUrlContainer.classList.add('hidden');
                    } else {
                        imageContainer.innerHTML = '<p class="text-[rgb(var(--danger))]">No OG image found. Enter an image URL below.</p>';
                        document.getElementById('imagePath').value = '';
                        manualImageUrlContainer.classList.remove('hidden');
                    }
                } catch (error) {
                    console.error('Error:', error);
                    imageContainer.innerHTML = '<p class="text-[rgb(var(--danger))]">Error fetching OG image. Enter an image URL below.</p>';
                    document.getElementById('imagePath').value = '';
                    manualImageUrlContainer.classList.remove('hidden');
                }
            } else {
                imageContainer.innerHTML = '';
                document.getElementById('imagePath').value = '';
                manualImageUrlContainer.classList.add('hidden');
            }
        }, 500);

        linkInput.addEventListener('input', handleInput);

        manualImageUrlInput.addEventListener('input', () => {
            const manualImageUrl = manualImageUrlInput.value.trim();
            if (manualImageUrl) {
                if (manualImageUrl.startsWith('http')) {
                    imageContainer.innerHTML = `<img src="${manualImageUrl}" alt="Manual Image" class="mt-4 w-full rounded shadow-lg">`;
                    document.getElementById('imagePath').value = manualImageUrl;
                } else {
                    imageContainer.innerHTML = '<p class="text-[rgb(var(--danger))]">Invalid image URL. Please enter a valid URL.</p>';
                    document.getElementById('imagePath').value = '';
                }
            } else {
                imageContainer.innerHTML = '';
                document.getElementById('imagePath').value = '';
            }
        });
    });

    let customFieldCounter = 0;

    function addCustomField() {
        const container = document.getElementById('customFieldsContainer');
        const fieldId = customFieldCounter++;

        const fieldDiv = document.createElement('div');
        fieldDiv.className = 'flex items-center gap-2 rounded border border-[rgb(var(--border))] bg-[rgb(var(--surface))] p-2';
        fieldDiv.innerHTML = `
            <input type="text" name="custom_field_key_${fieldId}" placeholder="Field name (e.g., Shoe Size)" class="input flex-1">
            <input type="text" name="custom_field_value_${fieldId}" placeholder="Value (e.g., 6)" class="input flex-1">
            <button type="button" onclick="this.parentElement.remove()" class="rounded bg-[rgb(var(--danger))] px-2 py-1 text-sm font-bold text-white">
                ✕
            </button>
        `;
        container.appendChild(fieldDiv);
    }
</script>
{% endblock %}
