{% extends 'base_standalone.html' %}
{% block title %}{{ _('Environment Setup') }}{% endblock %}

{% block content %}
<div class="mb-6 text-center">
    <h1 class="text-2xl font-semibold text-[rgb(var(--text))]">{{ _('Environment Variable Setup') }}</h1>
</div>

<form action="{{ url_for('setupenv') }}" method="POST" class="space-y-4">
    <div>
        <label for="SYSTEM_EMAIL" class="label font-semibold">{{ _('System Email:') }}</label>
        <input type="email" name="SYSTEM_EMAIL" id="SYSTEM_EMAIL" class="input" placeholder="{{ _('System Email') }}">
    </div>

    <div>
        <label for="DELETE_DAYS" class="label font-semibold">{{ _('Delete Days:') }}</label>
        <input type="number" name="DELETE_DAYS" id="DELETE_DAYS" class="input" placeholder="{{ _('Default: 30') }}" value="{{ DELETE_DAYS }}">
    </div>

    <div>
        <label for="OIDC_SERVER_METADATA_URL" class="label font-semibold">{{ _('OIDC Server Metadata URL:') }}</label>
        <input type="url" name="OIDC_SERVER_METADATA_URL" id="OIDC_SERVER_METADATA_URL" class="input" placeholder="{{ _('OIDC Server Metadata URL') }}">
    </div>

    <div>
        <label for="OIDC_LOGOUT_URL" class="label font-semibold">{{ _('OIDC Logout URL:') }}</label>
        <input type="url" name="OIDC_LOGOUT_URL" id="OIDC_LOGOUT_URL" class="input" placeholder="{{ _('OIDC Logout URL') }}">
    </div>

    <div>
        <label for="PRIMARY_OIDC_FIELD" class="label font-semibold">{{ _('Primary OIDC Field:') }}</label>
        <input type="text" name="PRIMARY_OIDC_FIELD" id="PRIMARY_OIDC_FIELD" class="input" value="email" placeholder="{{ _('Default: email') }}">
    </div>

    <div>
        <label for="SECONDARY_OIDC_FIELD" class="label font-semibold">{{ _('Secondary OIDC Field:') }}</label>
        <input type="text" name="SECONDARY_OIDC_FIELD" id="SECONDARY_OIDC_FIELD" class="input" value="preferred_username" placeholder="{{ _('Default: preferred_username') }}">
    </div>

    <div>
        <label for="PRIMARY_DB_FIELD" class="label font-semibold">{{ _('Primary DB Field:') }}</label>
        <input type="text" name="PRIMARY_DB_FIELD" id="PRIMARY_DB_FIELD" class="input" value="email" placeholder="{{ _('Default: email') }}">
    </div>

    <div>
        <label for="SECONDARY_DB_FIELD" class="label font-semibold">{{ _('Secondary DB Field:') }}</label>
        <input type="text" name="SECONDARY_DB_FIELD" id="SECONDARY_DB_FIELD" class="input" value="username" placeholder="{{ _('Default: username') }}">
    </div>

    <div>
        <label for="ENABLE_AUTO_REGISTRATION" class="label font-semibold">{{ _('Enable Auto Registration:') }}</label>
        <select name="ENABLE_AUTO_REGISTRATION" id="ENABLE_AUTO_REGISTRATION" class="input">
            <option value="true">{{ _('True') }}</option>
            <option value="false" selected>{{ _('False') }}</option>
        </select>
    </div>

    <div>
        <button type="submit" class="btn-primary mr-2">{{ _('Save Configuration') }}</button>
        <a href="{{ url_for('index') }}" class="btn-secondary">{{ _('Skip for Now') }}</a>
        <p class="mt-2 text-sm text-[rgb(var(--text-secondary))]">{{ _('You can configure these settings later in the parameters section.') }}</p>
    </div>
</form>
{% endblock %}
