{% extends 'base.html' %}
{% block title %}{{ _('Setup OIDC Configuration') }}{% endblock %}
{% block page_title %}{{ _('Setup OIDC Configuration') }}{% endblock %}
{% block sidebar %}{% include '_admin_sidebar.html' %}{% endblock %}

{% block content %}
<form method="POST" class="card space-y-6 p-6 sm:p-8">
    <div>
        <label for="OIDC_SERVER_METADATA_URL" class="label text-base">{{ _('OIDC Server Metadata URL:') }}</label>
        <input type="text" id="OIDC_SERVER_METADATA_URL" name="OIDC_SERVER_METADATA_URL" class="input" value="{{ current_values['OIDC_SERVER_METADATA_URL'] }}" required>
    </div>

    <div>
        <label for="OIDC_LOGOUT_URL" class="label text-base">{{ _('OIDC Logout URL:') }}</label>
        <input type="text" id="OIDC_LOGOUT_URL" name="OIDC_LOGOUT_URL" class="input" value="{{ current_values['OIDC_LOGOUT_URL'] }}">
    </div>

    <div>
        <label for="PRIMARY_OIDC_FIELD" class="label text-base">{{ _('Primary OIDC Field:') }}</label>
        <input type="text" id="PRIMARY_OIDC_FIELD" name="PRIMARY_OIDC_FIELD" value="{{ current_values['PRIMARY_OIDC_FIELD'] }}" class="input" placeholder="{{ _('Enter the primary OIDC field') }}">
    </div>

    <div>
        <label for="SECONDARY_OIDC_FIELD" class="label text-base">{{ _('Secondary OIDC Field:') }}</label>
        <input type="text" id="SECONDARY_OIDC_FIELD" name="SECONDARY_OIDC_FIELD" value="{{ current_values['SECONDARY_OIDC_FIELD'] }}" class="input" placeholder="{{ _('Enter the secondary OIDC field') }}">
    </div>

    <div>
        <label for="PRIMARY_DB_FIELD" class="label text-base">{{ _('Primary DB Field:') }}</label>
        <select id="PRIMARY_DB_FIELD" name="PRIMARY_DB_FIELD" class="input">
            <option value="email" {% if current_values['PRIMARY_DB_FIELD'] == 'email' %}selected{% endif %}>{{ _('Email') }}</option>
            <option value="username" {% if current_values['PRIMARY_DB_FIELD'] == 'username' %}selected{% endif %}>{{ _('Username') }}</option>
            <option value="full_name" {% if current_values['PRIMARY_DB_FIELD'] == 'full_name' %}selected{% endif %}>{{ _('Full Name') }}</option>
        </select>
    </div>

    <div>
        <label for="SECONDARY_DB_FIELD" class="label text-base">{{ _('Secondary DB Field:') }}</label>
        <select id="SECONDARY_DB_FIELD" name="SECONDARY_DB_FIELD" class="input">
            <option value="username" {% if current_values['SECONDARY_DB_FIELD'] == 'username' %}selected{% endif %}>{{ _('Username') }}</option>
            <option value="email" {% if current_values['SECONDARY_DB_FIELD'] == 'email' %}selected{% endif %}>{{ _('Email') }}</option>
            <option value="full_name" {% if current_values['SECONDARY_DB_FIELD'] == 'full_name' %}selected{% endif %}>{{ _('Full Name') }}</option>
        </select>
    </div>

    <div>
        <label for="ENABLE_AUTO_REGISTRATION" class="label text-base">{{ _('Enable Auto Registration:') }}</label>
        <select id="ENABLE_AUTO_REGISTRATION" name="ENABLE_AUTO_REGISTRATION" class="input">
            <option value="true" {% if current_values['ENABLE_AUTO_REGISTRATION'] == 'true' %}selected{% endif %}>{{ _('True') }}</option>
            <option value="false" {% if current_values['ENABLE_AUTO_REGISTRATION'] == 'false' %}selected{% endif %}>{{ _('False') }}</option>
        </select>
    </div>

    <div>
        <label for="ENABLE_DEFAULT_LOGIN" class="label text-base">{{ _('Enable Default Login Form:') }}</label>
        <select id="ENABLE_DEFAULT_LOGIN" name="ENABLE_DEFAULT_LOGIN" class="input">
            <option value="true" {% if current_values['ENABLE_DEFAULT_LOGIN'] == 'true' %}selected{% endif %}>{{ _('True') }}</option>
            <option value="false" {% if current_values['ENABLE_DEFAULT_LOGIN'] == 'false' %}selected{% endif %}>{{ _('False') }}</option>
        </select>
    </div>

    <div class="flex justify-end pt-4">
        <button type="submit" class="btn-primary">{{ _('Save Changes') }}</button>
    </div>
</form>
{% endblock %}
